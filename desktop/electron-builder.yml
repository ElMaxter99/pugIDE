# Instaladores de PugIDE de escritorio. SIN FIRMAR a propósito: el proyecto es libre y gratuito, no usa certificados de
# pago (ver docs/INSTALAR.md). Se construye cada sistema en su propia máquina (ver .github/workflows/desktop.yml).
appId: com.elmaxter99.pugide
productName: PugIDE
copyright: Copyright © ElMaxter99. Licencia MIT.
artifactName: PugIDE-${version}-${os}-${arch}.${ext}
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - package.json
  # Iconos que usa la ventana en tiempo de ejecución (main.cjs, APP_ICON).
  - build/icon.png
  - build/icon.ico
extraResources:
  - from: ../dist/pug-ide/browser
    to: app-web
  - from: ../vercel.json
    to: vercel.json
electronLanguages:
  - es
  - en-US
protocols:
  - name: PugIDE
    schemes:
      - pugide
# Actualizar dentro de la app (P-35/P-36, docs/ACTUALIZAR-ESCRITORIO.md): con esto electron-builder genera latest*.yml,
# los *.blockmap y, dentro de la app, app-update.yml (y package-type en .deb/.rpm). No publica nada por sí mismo: el CI
# construye con --publish never y sube los archivos a la release del tag.
publish:
  provider: github
  owner: ElMaxter99
  repo: pugIDE
  releaseType: release

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  # Abrir con PugIDE (P-40): .pug y .jade en «Abrir con», sin tocar el programa por defecto (build/installer.nsh).
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: PugIDE-${version}-windows-${arch}-instalador.${ext}
portable:
  artifactName: PugIDE-${version}-windows-${arch}-portable.${ext}

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
  identity: null
  # Abrir con PugIDE (P-40): «Alternate» la ofrece en «Abrir con» sin quitar el programa por defecto.
  fileAssociations:
    - ext: [pug, jade]
      name: Plantilla Pug
      role: Editor
      rank: Alternate
  hardenedRuntime: false
  gatekeeperAssess: false
dmg:
  artifactName: PugIDE-${version}-mac-${arch}.${ext}

linux:
  category: Development
  maintainer: ElMaxter99 <elmaxter99@users.noreply.github.com>
  synopsis: IDE de Pug/Jade 100 % local
  description: IDE de Pug/Jade en una ventana propia, con vista previa en vivo y datos de ejemplo. Funciona sin conexión; tu código no sale de tu equipo.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
    - target: rpm
      arch: [x64]
  executableName: pugide
  # Abrir con PugIDE (P-40): .deb y .rpm instalan el tipo text/x-pug y la app aparece en «Abrir con». El AppImage no
  # puede registrar tipos de archivo.
  # Una entrada por extensión: con las dos juntas electron-builder escribe el patrón «*.pug,jade», que no vale.
  fileAssociations:
    - ext: pug
      name: Plantilla Pug
      mimeType: text/x-pug
    - ext: jade
      name: Plantilla Jade
      mimeType: text/x-jade
  syncDesktopName: true
  desktop:
    entry:
      StartupWMClass: PugIDE
      Keywords: pug;jade;html;template;
appImage:
  artifactName: PugIDE-${version}-linux-${arch}.${ext}
deb:
  artifactName: PugIDE-${version}-linux-${arch}.${ext}
rpm:
  artifactName: PugIDE-${version}-linux-${arch}.${ext}
