<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Vista previa · PugIDE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { margin: 0; height: 100%; background: #fff; font-family: system-ui, sans-serif; color: #333; }
    iframe { display: block; border: 0; width: 100%; height: 100%; }
    img { display: block; max-width: 100%; margin: 0 auto; }
    p { padding: 24px; }
  </style>
</head>
<body>
  <p id="wait">Cargando la vista previa…</p>
  <script>
    // Página de PugIDE que muestra contenido del usuario en una pestaña propia SIN ejecutarlo con los
    // permisos de la app: el HTML va en un iframe `sandbox` sin `allow-same-origin` (origen opaco) y las
    // imágenes en <img>, que no ejecuta scripts (un SVG con <script> abierto como documento sí lo haría).
    (function () {
      var opener = window.opener;
      if (!opener) { document.body.innerHTML = '<p>Abre esta vista previa desde PugIDE.</p>'; return; }
      window.addEventListener('message', function (e) {
        if (e.source !== opener || e.origin !== location.origin) return;
        var d = e.data;
        if (!d) return;
        if (d.kind === 'html' && typeof d.html === 'string') {
          var frame = document.createElement('iframe');
          frame.setAttribute('sandbox', 'allow-scripts allow-modals');
          frame.srcdoc = d.html;
          document.body.replaceChildren(frame);
        } else if (d.kind === 'image' && typeof d.url === 'string' && d.url.indexOf('blob:') === 0) {
          var img = new Image();
          img.src = d.url;
          img.alt = '';
          document.body.replaceChildren(img);
        }
      });
      opener.postMessage({ source: 'pugide-host-ready' }, location.origin);
    })();
  </script>
</body>
</html>
