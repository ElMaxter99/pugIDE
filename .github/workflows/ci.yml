name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests unitarios
        run: npm run test:unit
      - name: Build de produccion
        run: npm run build:prod
      - name: Tests e2e
        run: npm run test:e2e
      - name: Caché de Chromium (Playwright)
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('node_modules/playwright-core/package.json') }}
      - name: Instalar Chromium para las pruebas de interfaz
        # Sin --with-deps: las librerías de Chromium ya vienen en el runner y apt tardaba minutos instalando fuentes que no hacen falta.
        run: npx playwright-core install chromium
      - name: Tests de interfaz
        run: npm run test:ui
